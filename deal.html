<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Deal memo · DealLens</title>
<style>
:root{--ink:#1a1a1a;--paper:#f5f1e8;--rule:#d8d2c2;--accent:#8b6f3d;--mute:#6b6358}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Georgia,'Times New Roman',serif;line-height:1.65}
header{padding:20px 40px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--paper);z-index:5}
header a{color:var(--ink);text-decoration:none;font-weight:600}
header nav a{margin-left:24px;font-weight:400;color:var(--mute)}
main{max-width:760px;margin:48px auto;padding:0 32px}
.kicker{font-family:'Courier New',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 6px}
h1{font-size:48px;line-height:1.1;margin:0 0 8px}
.lede{color:var(--mute);font-size:18px;margin:0 0 32px}
.chip{display:inline-block;border:1px solid var(--rule);border-radius:99px;padding:4px 12px;font-size:12px;margin-right:6px;font-family:'Courier New',monospace;color:var(--mute)}
section{margin:48px 0;padding-top:24px;border-top:1px solid var(--rule)}
h2{font-size:32px;margin:0 0 8px}
.data{background:#fff;border:1px solid var(--rule);border-radius:6px;padding:16px 20px;font-family:'Courier New',monospace;font-size:14px;margin:16px 0}
.data div{display:grid;grid-template-columns:90px 1fr;gap:12px;padding:4px 0}
.data b{font-weight:700}
.pending{color:var(--mute);font-style:italic}
.agent{font-family:'Courier New',monospace;font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:.12em;margin-top:6px}
</style>
</head>
<body>
<header><a href="./">DealLens · Marketlogic Investors</a><nav><a href="./">Memo</a><a href="./deals.html">Pipeline</a><a href="./submit.html">Submit</a></nav></header>
<main id="app"><p class="pending">Loading deal…</p></main>
<script>
const CH=[['customer','01','WHY','The Customer','ingest'],['problem','02','WHY','The Problem','research'],['solution','03','WHY','The Solution','ingest'],['company','04','WHAT','The Company','ingest'],['market','05','WHAT','The Market (TAM/SAM/SOM)','research'],['comp','06','WHAT','Competition','research'],['team','07','WHO','The Team','team'],['traction','08','HOW','Traction','ingest'],['moat','09','HOW','Moat','research'],['macro','10','SO-WHAT','Macro','research'],['micro','11','SO-WHAT','Unit economics','unit-econ'],['geo','12','SO-WHAT','Geopolitics','research'],['risks','13','SO-WHAT','Risks','research'],['verdict','14','SO-WHAT','Verdict','team']];
const money=v=>v?'$'+Number(v).toLocaleString():'—';
const pct=v=>v?Number(v)+'%':'—';
function render(d){const app=document.getElementById('app');const html=[];html.push('<p class="kicker">'+(d.stage||'').toUpperCase()+' · '+(d.sector||'').toUpperCase()+' · '+(d.hq||'').toUpperCase()+'</p>');html.push('<h1>'+(d.name||d.id)+'.</h1>');html.push('<p class="lede">'+(d.thesis||'Thesis pending.')+'</p>');html.push('<div><span class="chip">ask '+money(d.ask)+'</span><span class="chip">pre '+money(d.premoney)+'</span><span class="chip">'+(d.lead||'')+'</span><span class="chip">'+(d.status||'intake')+'</span></div>');for(const [k,n,act,title,agent] of CH){html.push('<section id="'+k+'"><p class="kicker">'+n+' · '+act+'</p><h2>'+title+'</h2>');if(k==='customer'){html.push('<div class="data"><div><b>ICP</b><span>'+(d.icp||'—')+'</span></div><div><b>JTBD</b><span>'+(d.jtbd||'—')+'</span></div><div><b>WTP</b><span>'+(d.wtp||'—')+'</span></div></div>');}else if(k==='traction'){html.push('<div class="data"><div><b>ARR</b><span>'+money(d.arr)+'</span></div><div><b>MoM</b><span>'+pct(d.mom)+'</span></div><div><b>Logos</b><span>'+(d.logos||'—')+'</span></div><div><b>NRR</b><span>'+pct(d.nrr)+'</span></div></div>');}else if(k==='team'&&Array.isArray(d.founders)&&d.founders.length){html.push('<div class="data">'+d.founders.map(u=>'<div><b>founder</b><span>'+u+'</span></div>').join('')+'</div>');}else{html.push('<p class="pending">Awaiting agent enrichment.</p>');}html.push('<p class="agent">→ '+agent+'-agent</p></section>');}app.innerHTML=html.join('');}
async function load(){const id=new URLSearchParams(location.search).get('id');if(!id){document.getElementById('app').innerHTML='<p>No deal id. <a href="./deals.html">Back to pipeline</a>.</p>';return;}try{const r=await fetch('./deals/'+id+'.json',{cache:'no-store'});if(!r.ok)throw 0;render(await r.json());}catch(e){document.getElementById('app').innerHTML='<p>Deal <code>'+id+'</code> not found.</p>';}}
load();
</script>
</body>
</html>

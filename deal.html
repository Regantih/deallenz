<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Deal memo · DealLens</title>
<link rel="stylesheet" href="./styles/tokens.css"/>
<style>
/* === Reset ============================================================ */
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--color-paper);color:var(--color-ink);
  font-family:var(--font-serif);line-height:var(--leading-normal);
  -webkit-font-smoothing:antialiased}

/* === Skip link ========================================================= */
.skip-link{
  position:absolute;left:-999px;top:auto;width:1px;height:1px;
  overflow:hidden;z-index:var(--z-modal);
  background:var(--color-ink);color:var(--color-paper);
  padding:8px 16px;text-decoration:none;border-radius:var(--radius-sm);
  font-family:var(--font-sans);font-size:var(--text-sm)}
.skip-link:focus{
  position:fixed;left:16px;top:16px;
  width:auto;height:auto;overflow:visible}

/* === App header ======================================================== */
.app-header{
  position:sticky;top:0;z-index:var(--z-sticky);
  background:var(--color-paper);border-bottom:1px solid var(--color-rule);
  height:var(--header-h);padding:0 var(--space-6);
  display:flex;align-items:center;justify-content:space-between}
.brand{
  display:flex;align-items:center;gap:var(--space-2);
  text-decoration:none;color:var(--color-ink);
  font-weight:700;font-family:var(--font-sans);
  font-size:var(--text-sm);letter-spacing:.02em}
.brand-logo{
  width:20px;height:20px;background:var(--color-ink);
  border-radius:var(--radius-sm);position:relative;flex-shrink:0}
.brand-logo::after{
  content:'';position:absolute;inset:4px;
  border:2px solid var(--color-paper);border-radius:2px}
.app-nav{display:flex;gap:var(--space-5);align-items:center}
.nav-link{
  color:var(--color-mute);text-decoration:none;
  font-family:var(--font-sans);font-size:var(--text-sm);
  padding:4px 0;border-bottom:2px solid transparent;
  transition:color .15s,border-color .15s}
.nav-link:hover{color:var(--color-ink)}
.nav-link.active{
  color:var(--color-ink);border-bottom-color:var(--color-ink);font-weight:600}
.nav-link--stub{opacity:.45;cursor:not-allowed;pointer-events:none}

/* === Page layout ======================================================= */
.page-wrap{
  max-width:var(--container-lg);
  margin:0 auto;padding:0 var(--space-6)}
.memo-layout{
  display:grid;
  grid-template-columns:220px 1fr;
  gap:var(--space-7);
  align-items:start;
  padding:var(--space-7) 0 var(--space-8)}

/* === TOC sidebar ======================================================= */
.toc{
  position:sticky;
  top:calc(var(--header-h) + var(--space-4));
  max-height:calc(100vh - var(--header-h) - var(--space-8));
  overflow-y:auto;
  padding-right:var(--space-3);
  scrollbar-width:thin;
  scrollbar-color:var(--color-rule) transparent}
.toc-heading{
  font-family:var(--font-mono);font-size:var(--text-xs);
  letter-spacing:.14em;text-transform:uppercase;
  color:var(--color-accent);margin:0 0 var(--space-3)}
.toc-act{
  font-family:var(--font-mono);font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;
  color:var(--color-mute);margin:var(--space-3) 0 var(--space-1)}
.toc-link{
  display:block;padding:5px var(--space-3);margin:1px 0;
  font-family:var(--font-sans);font-size:var(--text-sm);
  color:var(--color-mute);text-decoration:none;
  border-left:2px solid transparent;
  border-radius:0 var(--radius-sm) var(--radius-sm) 0;
  transition:color .12s,border-color .12s,background .12s;
  line-height:1.4}
.toc-link:hover{color:var(--color-ink);background:rgba(0,0,0,.03)}
.toc-link.active{
  color:var(--color-ink);border-left-color:var(--color-accent);
  font-weight:600;background:rgba(139,111,61,.07)}

/* === Exhibits panel (inside sidebar) =================================== */
.exhibits-panel{
  margin-top:var(--space-6);
  padding-top:var(--space-5);
  border-top:1px solid var(--color-rule)}
.exhibits-heading{
  font-family:var(--font-mono);font-size:var(--text-xs);
  letter-spacing:.14em;text-transform:uppercase;
  color:var(--color-accent);margin:0 0 var(--space-3);
  display:flex;align-items:center;gap:6px}
.exhibit-item{
  display:flex;align-items:flex-start;
  gap:8px;padding:6px 0;
  border-bottom:1px dashed var(--color-rule);
  font-family:var(--font-sans);font-size:var(--text-sm)}
.exhibit-item:last-child{border-bottom:none}
.exhibit-icon{flex-shrink:0;color:var(--color-accent);line-height:1.4}
.exhibit-link{
  color:var(--color-ink);text-decoration:none;
  word-break:break-word;line-height:1.4}
.exhibit-link:hover{text-decoration:underline;color:var(--color-accent)}
.exhibit-type{
  display:block;font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--color-mute);margin-top:1px}
.exhibits-empty{
  font-family:var(--font-sans);font-size:var(--text-sm);
  color:var(--color-mute);font-style:italic;line-height:1.5}

/* === Cost panel ======================================================== */
.cost-panel{
  background:var(--color-card);border:1px solid var(--color-rule);
  border-radius:var(--radius-md);
  padding:var(--space-4) var(--space-5);
  margin-bottom:var(--space-5)}
.cost-panel-hd{
  display:flex;align-items:center;gap:8px;
  margin-bottom:var(--space-3)}
.cost-panel-title{
  font-family:var(--font-mono);font-size:var(--text-xs);
  letter-spacing:.14em;text-transform:uppercase;
  color:var(--color-accent);margin:0}
.cost-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(130px,1fr));
  gap:var(--space-2) var(--space-6)}
.cost-label{
  display:block;font-family:var(--font-mono);
  font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--color-mute)}
.cost-value{
  display:block;font-family:var(--font-mono);
  font-size:var(--text-sm);color:var(--color-ink);font-weight:600;
  margin-top:2px}
.cost-empty{
  font-family:var(--font-sans);font-size:var(--text-sm);
  color:var(--color-mute);font-style:italic;margin:0}

/* === Memo hero ========================================================= */
.memo-hero{
  padding-bottom:var(--space-6);
  border-bottom:2px solid var(--color-rule);
  margin-bottom:var(--space-7)}
.kicker{
  font-family:var(--font-mono);font-size:var(--text-xs);
  letter-spacing:.14em;text-transform:uppercase;
  color:var(--color-accent);margin:0 0 var(--space-2)}
.memo-h1{
  font-size:var(--text-4xl);line-height:var(--leading-tight);
  margin:0 0 var(--space-3);font-family:var(--font-serif)}
.lede{
  color:var(--color-mute);font-size:var(--text-lg);
  margin:0 0 var(--space-5);max-width:640px;
  line-height:var(--leading-snug)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  display:inline-block;border:1px solid var(--color-rule);
  border-radius:var(--radius-full);
  padding:4px 12px;font-size:var(--text-xs);
  font-family:var(--font-mono);color:var(--color-mute)}

/* === Memo sections ===================================================== */
.memo-section{
  margin:0 0 var(--space-7);
  padding-top:var(--space-5);
  border-top:1px solid var(--color-rule);
  scroll-margin-top:calc(var(--header-h) + var(--space-4))}
.section-num{
  font-family:var(--font-mono);font-size:var(--text-xs);
  letter-spacing:.14em;text-transform:uppercase;
  color:var(--color-accent);margin:0 0 6px}
.memo-h2{
  font-size:var(--text-2xl);line-height:var(--leading-tight);
  margin:0 0 var(--space-4);font-family:var(--font-serif)}
.anchor-link{
  color:inherit;text-decoration:none;
  display:inline-flex;align-items:center;gap:6px}
.anchor-link::after{
  content:'#';font-size:var(--text-sm);opacity:0;
  color:var(--color-rule);transition:opacity .15s}
.memo-h2:hover .anchor-link::after{opacity:1}
.data-grid{
  background:var(--color-white);border:1px solid var(--color-rule);
  border-radius:var(--radius-md);
  padding:var(--space-4) var(--space-5);
  font-family:var(--font-mono);font-size:var(--text-sm);
  margin:var(--space-4) 0}
.data-row{
  display:grid;grid-template-columns:110px 1fr;
  gap:var(--space-3);padding:6px 0;
  border-bottom:1px dashed var(--color-rule)}
.data-row:last-child{border-bottom:none}
.data-key{font-weight:700;color:var(--color-mute)}
.data-val{color:var(--color-ink);word-break:break-word}
.data-val a{color:var(--color-accent);text-decoration:none}
.data-val a:hover{text-decoration:underline}
.empty-state{
  color:var(--color-mute);font-style:italic;
  font-family:var(--font-sans);font-size:var(--text-base);
  border:1px dashed var(--color-rule);
  border-radius:var(--radius-md);
  padding:var(--space-5) var(--space-6);
  background:var(--color-card);margin:var(--space-4) 0;
  line-height:var(--leading-snug)}
.agent-tag{
  font-family:var(--font-mono);font-size:var(--text-xs);
  color:var(--color-accent);text-transform:uppercase;
  letter-spacing:.12em;margin-top:var(--space-3)}

/* === Error / loading states ============================================ */
.state-wrap{
  text-align:center;padding:var(--space-8) var(--space-6)}
.state-wrap .kicker{margin-bottom:var(--space-3)}
.state-wrap h1{font-size:var(--text-3xl);margin:0 0 var(--space-4)}
.state-wrap p{color:var(--color-mute);font-family:var(--font-sans);font-size:var(--text-base);margin:0 0 var(--space-2)}
.state-wrap a{color:var(--color-accent);text-decoration:none}
.state-wrap a:hover{text-decoration:underline}

/* === App footer ======================================================== */
.app-footer{
  border-top:1px solid var(--color-rule);
  padding:var(--space-5) var(--space-6);
  display:flex;justify-content:space-between;align-items:center;
  font-family:var(--font-sans);font-size:var(--text-xs);
  color:var(--color-mute)}
.app-footer a{color:var(--color-mute);text-decoration:none}
.app-footer a:hover{color:var(--color-ink);text-decoration:underline}

/* === Responsive ======================================================== */
@media(max-width:960px){
  .memo-layout{
    grid-template-columns:1fr;
    gap:0;padding-top:0}
  .toc{
    position:static;max-height:none;overflow:visible;
    display:flex;flex-wrap:nowrap;overflow-x:auto;
    gap:0;padding:var(--space-4) 0;
    border-bottom:1px solid var(--color-rule);
    margin-bottom:var(--space-5);
    scrollbar-width:none}
  .toc::-webkit-scrollbar{display:none}
  .toc-heading,.toc-act{display:none}
  .toc-link{
    border-left:none;border-bottom:2px solid transparent;
    border-radius:var(--radius-full);
    padding:4px 10px;font-size:var(--text-xs);
    white-space:nowrap;flex-shrink:0}
  .toc-link.active{
    border-left:none;border-bottom:2px solid var(--color-accent);
    background:rgba(139,111,61,.07)}
  .exhibits-panel{
    border-top:none;margin-top:0;
    padding:var(--space-4) 0 0}}
@media(max-width:600px){
  .app-header{padding:0 var(--space-4)}
  .page-wrap{padding:0 var(--space-4)}
  .memo-h1{font-size:var(--text-3xl)}
  .app-footer{flex-direction:column;gap:var(--space-2);text-align:center}
  .cost-grid{grid-template-columns:1fr 1fr}}

/* === Print ============================================================= */
@media print{
  .skip-link,.app-header,.toc,.cost-panel,.agent-tag{
    display:none!important}
  body{
    background:#fff;color:#000;
    font-size:11pt;line-height:1.5}
  .page-wrap{max-width:none;padding:0}
  .memo-layout{display:block;padding:0}
  .memo-h1{font-size:24pt}
  .memo-h2{font-size:16pt}
  .memo-section{
    border-top:.5pt solid #ccc;
    break-inside:avoid;
    page-break-inside:avoid;
    padding-top:12pt;
    margin-bottom:24pt}
  .data-grid{border:.5pt solid #ccc}
  .data-row{border-bottom:.5pt dashed #ccc}
  .chip{border:.5pt solid #ccc}
  .empty-state{
    border:.5pt dashed #ccc;
    background:#f9f9f9}
  .exhibits-panel{display:block!important;border-top:.5pt solid #ccc}
  .app-footer{
    display:block;text-align:center;
    border-top:.5pt solid #ccc;font-size:8pt;padding-top:8pt}
  a{color:inherit;text-decoration:none}
  .anchor-link::after{display:none!important}}
</style>
</head>
<body>
<a class="skip-link" href="#memo-content">Skip to memo content</a>

<!-- ======= App header ================================================= -->
<header class="app-header" role="banner">
  <a class="brand" href="./index.html" aria-label="DealLens — go to home">
    <span class="brand-logo" role="img" aria-hidden="true"></span>
    <span>DealLens · Marketlogic Investors</span>
  </a>
  <nav class="app-nav" aria-label="Main navigation">
    <a href="./deals.html" class="nav-link">Pipeline</a>
    <a href="./submit.html" class="nav-link">Submit</a>
    <a class="nav-link nav-link--stub" aria-disabled="true" tabindex="-1">Settings</a>
  </nav>
</header>

<!-- ======= Main content =============================================== -->
<div class="page-wrap" id="main-content">
  <div id="app" role="main" aria-live="polite" aria-label="Deal memo">
    <div class="state-wrap"><p>Loading deal…</p></div>
  </div>
</div>

<!-- ======= App footer ================================================= -->
<footer class="app-footer" role="contentinfo">
  <span>© 2026 Marketlogic Investors LLC · Internal use only.</span>
  <span id="build-meta" aria-label="App version"></span>
</footer>

<script>
'use strict';

// -----------------------------------------------------------------------
// Constants
// -----------------------------------------------------------------------
const CH = [
  ['customer','01','WHY','The Customer','ingest'],
  ['problem','02','WHY','The Problem','research'],
  ['solution','03','WHY','The Solution','ingest'],
  ['company','04','WHAT','The Company','ingest'],
  ['market','05','WHAT','The Market (TAM / SAM / SOM)','research'],
  ['comp','06','WHAT','Competition','research'],
  ['team','07','WHO','The Team','team'],
  ['traction','08','HOW','Traction','ingest'],
  ['moat','09','HOW','Moat','research'],
  ['macro','10','HOW','Macro','research'],
  ['micro','11','SO-WHAT','Unit Economics','unit-econ'],
  ['geo','12','SO-WHAT','Geopolitics','research'],
  ['risks','13','SO-WHAT','Risks','research'],
  ['verdict','14','SO-WHAT','Verdict','team']
];

const ACT_LABELS = {
  WHY:     'Act I · Why',
  WHAT:    'Act II · What',
  WHO:     'Act III · Who',
  HOW:     'Act IV · How',
  'SO-WHAT': 'Act V · So-What'
};

// -----------------------------------------------------------------------
// Helpers
// -----------------------------------------------------------------------
const money = v => v ? '$' + Number(v).toLocaleString() : '—';
const pct   = v => v ? Number(v) + '%' : '—';
const dur   = ms => ms >= 1000 ? (ms / 1000).toFixed(1) + 's' : ms + 'ms';
const esc   = s => s ? String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') : '';

// -----------------------------------------------------------------------
// Cost panel
// -----------------------------------------------------------------------
function buildCostPanel(d) {
  const c = d.cost || {};
  const tokIn  = c.tokens_in  ?? d.tokens_in;
  const tokOut = c.tokens_out ?? d.tokens_out;
  const model  = c.model      ?? d.model_used;
  const usd    = c.usd_cost   ?? d.usd_cost;
  const ms     = c.duration_ms ?? d.duration_ms;
  const runId  = c.run_id     ?? d.run_id;
  const hasAny = tokIn != null || usdCost != null || model;
  // usdCost never set above — use usd
  const hasData = tokIn != null || usd != null || model;

  const items = [
    model  ? `<div class="cost-item"><span class="cost-label">Model</span><span class="cost-value">${esc(model)}</span></div>` : '',
    runId  ? `<div class="cost-item"><span class="cost-label">Run ID</span><span class="cost-value" title="${esc(runId)}">${esc(String(runId).slice(0,14))}…</span></div>` : '',
    tokIn  != null ? `<div class="cost-item"><span class="cost-label">Tokens in</span><span class="cost-value">${Number(tokIn).toLocaleString()}</span></div>` : '',
    tokOut != null ? `<div class="cost-item"><span class="cost-label">Tokens out</span><span class="cost-value">${Number(tokOut).toLocaleString()}</span></div>` : '',
    ms     != null ? `<div class="cost-item"><span class="cost-label">Duration</span><span class="cost-value">${dur(ms)}</span></div>` : '',
    usd    != null ? `<div class="cost-item"><span class="cost-label">LLM cost</span><span class="cost-value">$${Number(usd).toFixed(4)}</span></div>` : '',
  ].filter(Boolean).join('');

  return `
    <div class="cost-panel" role="region" aria-label="Cost and run metadata">
      <div class="cost-panel-hd">
        <p class="cost-panel-title">Cost &amp; Run</p>
      </div>
      ${hasData
        ? `<div class="cost-grid">${items}</div>`
        : `<p class="cost-empty">Cost data not yet available.</p>`}
    </div>`;
}

// -----------------------------------------------------------------------
// Exhibits panel
// -----------------------------------------------------------------------
function buildExhibits(d) {
  const items = [];
  if (d.deck     && d.deck.trim())     items.push({ name: 'Pitch deck',  url: d.deck.trim(),     type: 'deck' });
  if (d.dataroom && d.dataroom.trim()) items.push({ name: 'Data room',   url: d.dataroom.trim(), type: 'data room' });
  if (d.model    && d.model.trim())    items.push({ name: 'Financial model', url: d.model.trim(), type: 'model' });
  if (Array.isArray(d.exhibits)) {
    for (const ex of d.exhibits) {
      if (ex && ex.url) items.push(ex);
    }
  }

  const list = items.length
    ? items.map(ex => `
        <div class="exhibit-item">
          <span class="exhibit-icon" aria-hidden="true">📎</span>
          <div>
            <a href="${esc(ex.url)}" class="exhibit-link"
               target="_blank" rel="noopener noreferrer"
               aria-label="Open ${esc(ex.name)} in new tab">${esc(ex.name)}</a>
            ${ex.type ? `<span class="exhibit-type">${esc(ex.type)}${ex.size ? ' · ' + esc(ex.size) : ''}</span>` : ''}
          </div>
        </div>`).join('')
    : `<p class="exhibits-empty">No exhibits attached yet.</p>`;

  return `
    <div class="exhibits-panel" role="complementary" aria-label="Exhibits and attachments">
      <p class="exhibits-heading">
        <span aria-hidden="true">📎</span> Exhibits
      </p>
      ${list}
    </div>`;
}

// -----------------------------------------------------------------------
// TOC
// -----------------------------------------------------------------------
function buildTOC() {
  const ACT_ORDER = ['WHY','WHAT','WHO','HOW','SO-WHAT'];
  const grouped = {};
  for (const [k, n, act, title] of CH) {
    if (!grouped[act]) grouped[act] = [];
    grouped[act].push({ id: k, n, title });
  }

  let html = '<p class="toc-heading">Contents</p>';
  for (const act of ACT_ORDER) {
    if (!grouped[act]) continue;
    html += `<p class="toc-act">${ACT_LABELS[act]}</p>`;
    for (const { id, n, title } of grouped[act]) {
      html += `<a class="toc-link" href="#${id}" data-section="${id}">${n} · ${title}</a>`;
    }
  }
  return html;
}

// -----------------------------------------------------------------------
// Section content
// -----------------------------------------------------------------------
function buildSection(k, n, act, title, agent, d) {
  let body = '';

  if (k === 'customer') {
    if (d.icp || d.jtbd || d.wtp) {
      body = `<div class="data-grid" role="table" aria-label="Customer details">`;
      if (d.icp)  body += `<div class="data-row"><span class="data-key">ICP</span><span class="data-val">${esc(d.icp)}</span></div>`;
      if (d.jtbd) body += `<div class="data-row"><span class="data-key">JTBD</span><span class="data-val">${esc(d.jtbd)}</span></div>`;
      if (d.wtp)  body += `<div class="data-row"><span class="data-key">WTP</span><span class="data-val">${esc(String(d.wtp))}</span></div>`;
      body += `</div>`;
    } else {
      body = `<div class="empty-state">No customer profile yet. Describe the ICP and JTBD during intake, or upload a deck with customer discovery data.</div>`;
    }

  } else if (k === 'traction') {
    if (d.arr || d.mom || d.logos || d.nrr) {
      body = `<div class="data-grid" role="table" aria-label="Traction metrics">`;
      if (d.arr)   body += `<div class="data-row"><span class="data-key">ARR</span><span class="data-val">${money(d.arr)}</span></div>`;
      if (d.mom)   body += `<div class="data-row"><span class="data-key">MoM growth</span><span class="data-val">${pct(d.mom)}</span></div>`;
      if (d.logos) body += `<div class="data-row"><span class="data-key">Logos</span><span class="data-val">${esc(String(d.logos))}</span></div>`;
      if (d.nrr)   body += `<div class="data-row"><span class="data-key">NRR</span><span class="data-val">${pct(d.nrr)}</span></div>`;
      body += `</div>`;
    } else {
      body = `<div class="empty-state">No traction data yet. Add ARR, MoM growth, logos, and NRR during intake or upload financials.</div>`;
    }

  } else if (k === 'team') {
    if (Array.isArray(d.founders) && d.founders.length) {
      body = `<div class="data-grid" role="table" aria-label="Founding team">`;
      for (const f of d.founders) {
        const isURL = typeof f === 'string' && f.startsWith('http');
        const display = isURL ? f.replace(/^https?:\/\/(www\.)?/,'').replace(/\/$/,'') : f;
        body += `<div class="data-row"><span class="data-key">Founder</span><span class="data-val">${
          isURL
            ? `<a href="${esc(f)}" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn profile: ${esc(display)}">${esc(display)}</a>`
            : esc(f)
        }</span></div>`;
      }
      body += `</div>`;
    } else {
      body = `<div class="empty-state">No team data yet. Add founder names or LinkedIn profiles during intake.</div>`;
    }

  } else if (k === 'company') {
    const hasCompanyData = d.name || d.stage || d.sector || d.hq || d.url;
    if (hasCompanyData) {
      body = `<div class="data-grid" role="table" aria-label="Company details">`;
      if (d.name)  body += `<div class="data-row"><span class="data-key">Company</span><span class="data-val">${esc(d.name)}</span></div>`;
      if (d.stage) body += `<div class="data-row"><span class="data-key">Stage</span><span class="data-val">${esc(d.stage)}</span></div>`;
      if (d.sector) body += `<div class="data-row"><span class="data-key">Sector</span><span class="data-val">${esc(d.sector)}</span></div>`;
      if (d.hq)    body += `<div class="data-row"><span class="data-key">HQ</span><span class="data-val">${esc(d.hq)}</span></div>`;
      if (d.url)   body += `<div class="data-row"><span class="data-key">Website</span><span class="data-val"><a href="${esc(d.url)}" target="_blank" rel="noopener noreferrer">${esc(d.url.replace(/^https?:\/\//,''))}</a></span></div>`;
      if (d.ask || d.premoney) {
        if (d.ask)      body += `<div class="data-row"><span class="data-key">Ask</span><span class="data-val">${money(d.ask)}</span></div>`;
        if (d.premoney) body += `<div class="data-row"><span class="data-key">Pre-money</span><span class="data-val">${money(d.premoney)}</span></div>`;
        if (d.lead)     body += `<div class="data-row"><span class="data-key">Lead</span><span class="data-val">${esc(d.lead)}</span></div>`;
      }
      body += `</div>`;
    } else {
      body = `<div class="empty-state">No company profile yet. Submit a deal to populate this section.</div>`;
    }

  } else {
    body = `<div class="empty-state">Not yet researched — connect enrichment agents and upload deal data to enable this section.</div>`;
  }

  return `
    <section class="memo-section" id="${k}" aria-labelledby="h-${k}">
      <p class="section-num">${n} · ${act}</p>
      <h2 class="memo-h2" id="h-${k}">
        <a class="anchor-link" href="#${k}" aria-label="Link to section: ${title}">${title}</a>
      </h2>
      ${body}
      <p class="agent-tag" aria-hidden="true">→ ${agent}-agent</p>
    </section>`;
}

// -----------------------------------------------------------------------
// Full memo render
// -----------------------------------------------------------------------
function render(d) {
  const app = document.getElementById('app');

  const sectionsHtml = CH
    .map(([k, n, act, title, agent]) => buildSection(k, n, act, title, agent, d))
    .join('');

  app.innerHTML = `
    ${buildCostPanel(d)}
    <div class="memo-layout">
      <nav class="toc" aria-label="Memo table of contents">
        ${buildTOC()}
        ${buildExhibits(d)}
      </nav>
      <article id="memo-content" tabindex="-1">
        <header class="memo-hero">
          <p class="kicker">${esc((d.stage || '').toUpperCase())}${d.sector ? ' · ' + esc(d.sector.toUpperCase()) : ''}${d.hq ? ' · ' + esc(d.hq.toUpperCase()) : ''}</p>
          <h1 class="memo-h1">${esc(d.name || d.id)}.</h1>
          <p class="lede">${esc(d.thesis || 'Thesis not yet captured.')}</p>
          <div class="chips" aria-label="Deal snapshot">
            ${d.ask      ? `<span class="chip">ask ${money(d.ask)}</span>` : ''}
            ${d.premoney ? `<span class="chip">pre ${money(d.premoney)}</span>` : ''}
            ${d.lead     ? `<span class="chip">${esc(d.lead)}</span>` : ''}
            ${d.status   ? `<span class="chip">${esc(d.status)}</span>` : ''}
          </div>
        </header>
        ${sectionsHtml}
      </article>
    </div>`;

  // Update page title
  document.title = `${d.name || d.id} · DealLens`;

  // TOC IntersectionObserver for active-section highlighting
  const tocLinks = document.querySelectorAll('.toc-link[data-section]');
  const sectionMap = new Map();
  tocLinks.forEach(link => {
    const el = document.getElementById(link.dataset.section);
    if (el) sectionMap.set(link.dataset.section, link);
  });

  const io = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        tocLinks.forEach(l => l.classList.remove('active'));
        const active = sectionMap.get(e.target.id);
        if (active) active.classList.add('active');
      }
    });
  }, { rootMargin: '-15% 0px -75% 0px' });

  document.querySelectorAll('.memo-section').forEach(s => io.observe(s));
}

// -----------------------------------------------------------------------
// Load
// -----------------------------------------------------------------------
async function load() {
  const app = document.getElementById('app');
  const id = new URLSearchParams(location.search).get('id');

  if (!id) {
    app.innerHTML = `
      <div class="state-wrap">
        <p class="kicker">No deal selected</p>
        <h1>Select a deal from the pipeline.</h1>
        <p><a href="./deals.html">← Back to Pipeline</a></p>
      </div>`;
    return;
  }

  try {
    const r = await fetch('./deals/' + encodeURIComponent(id) + '.json', { cache: 'no-store' });
    if (!r.ok) throw new Error('not-found');
    render(await r.json());
  } catch (e) {
    app.innerHTML = `
      <div class="state-wrap">
        <p class="kicker">Deal not found</p>
        <h1>No data for “${esc(id)}”.</h1>
        <p>This deal has no data file yet.</p>
        <p>
          <a href="./submit.html">Submit it</a> to start enrichment, or
          <a href="./deals.html">go back to the pipeline</a>.
        </p>
      </div>`;
  }
}

// -----------------------------------------------------------------------
// Footer build meta
// -----------------------------------------------------------------------
(async function loadBuild() {
  try {
    const r = await fetch('./build.json', { cache: 'no-store' });
    const b = await r.json();
    const el = document.getElementById('build-meta');
    if (el) el.textContent = 'v' + b.version + ' · ' + b.commit;
  } catch (e) {}
})();

load();
</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Pipeline · DealLens</title>
<link rel="stylesheet" href="./styles/tokens.css"/>
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--color-paper);color:var(--color-ink);font-family:var(--font-serif);line-height:var(--leading-normal)}

/* Skip link */
.skip-link{position:absolute;left:-999px;width:1px;height:1px;overflow:hidden;z-index:var(--z-modal);background:var(--color-ink);color:var(--color-paper);padding:8px 16px;text-decoration:none;border-radius:var(--radius-sm);font-family:var(--font-sans)}
.skip-link:focus{position:fixed;left:16px;top:16px;width:auto;height:auto;overflow:visible}

/* App header */
.app-header{position:sticky;top:0;z-index:var(--z-sticky);background:var(--color-paper);border-bottom:1px solid var(--color-rule);height:var(--header-h);padding:0 var(--space-6);display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:var(--space-2);text-decoration:none;color:var(--color-ink);font-weight:700;font-family:var(--font-sans);font-size:var(--text-sm);letter-spacing:.02em}
.brand-logo{width:20px;height:20px;background:var(--color-ink);border-radius:var(--radius-sm);position:relative;flex-shrink:0}
.brand-logo::after{content:'';position:absolute;inset:4px;border:2px solid var(--color-paper);border-radius:2px}
.app-nav{display:flex;gap:var(--space-5);align-items:center}
.nav-link{color:var(--color-mute);text-decoration:none;font-family:var(--font-sans);font-size:var(--text-sm);padding:4px 0;border-bottom:2px solid transparent;transition:color .15s,border-color .15s}
.nav-link:hover{color:var(--color-ink)}
.nav-link.active{color:var(--color-ink);border-bottom-color:var(--color-ink);font-weight:600}
.nav-link--stub{opacity:.45;cursor:not-allowed;pointer-events:none}

/* Page content */
.page-wrap{max-width:var(--container-lg);margin:0 auto;padding:var(--space-7) var(--space-6)}
.page-bar{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:var(--space-5)}
.page-kicker{font-family:var(--font-mono);font-size:var(--text-xs);letter-spacing:.14em;text-transform:uppercase;color:var(--color-accent);margin:0 0 var(--space-2)}
h1{font-size:var(--text-4xl);line-height:var(--leading-tight);margin:0 0 var(--space-2)}
.lede{color:var(--color-mute);font-size:var(--text-lg);margin:0;max-width:560px}
.btn-primary{display:inline-block;padding:10px 20px;border:1px solid var(--color-ink);background:var(--color-ink);color:var(--color-paper);text-decoration:none;border-radius:var(--radius-md);font-family:var(--font-sans);font-weight:600;font-size:var(--text-sm);flex-shrink:0}
.btn-primary:hover{background:#333;border-color:#333}

/* Kanban board */
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:var(--space-5);align-items:start}
.col{background:var(--color-card);border:1px solid var(--color-rule);border-radius:var(--radius-md);padding:var(--space-4);min-height:260px}
.col-head{font-family:var(--font-mono);font-size:var(--text-xs);letter-spacing:.14em;text-transform:uppercase;color:var(--color-accent);margin:0 0 var(--space-3)}
.deal-card{background:var(--color-white);border:1px solid var(--color-rule);border-radius:var(--radius-sm);padding:var(--space-3) var(--space-4);margin-bottom:var(--space-3);text-decoration:none;color:var(--color-ink);display:block;transition:border-color .15s,box-shadow .15s}
.deal-card:hover{border-color:var(--color-ink);box-shadow:var(--shadow-sm)}
.deal-card:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px;border-radius:var(--radius-sm)}
.deal-name{font-weight:700;font-size:var(--text-base);margin:0 0 4px}
.deal-meta{font-size:var(--text-xs);color:var(--color-mute);font-family:var(--font-mono)}
.col-empty{font-family:var(--font-sans);font-size:var(--text-sm);color:var(--color-mute);font-style:italic;padding:var(--space-3) 0}

/* Footer */
.app-footer{border-top:1px solid var(--color-rule);padding:var(--space-5) var(--space-6);display:flex;justify-content:space-between;align-items:center;font-family:var(--font-sans);font-size:var(--text-xs);color:var(--color-mute)}
.app-footer a{color:var(--color-mute);text-decoration:none}
.app-footer a:hover{color:var(--color-ink);text-decoration:underline}

@media(max-width:900px){.board{grid-template-columns:repeat(2,1fr)}.page-bar{flex-direction:column;gap:var(--space-4);align-items:flex-start}}
@media(max-width:600px){.app-header{padding:0 var(--space-4)}.page-wrap{padding:var(--space-6) var(--space-4)}.board{grid-template-columns:1fr}.app-footer{flex-direction:column;gap:var(--space-2);text-align:center}}
</style>
</head>
<body>
<a class="skip-link" href="#main-content">Skip to content</a>

<header class="app-header" role="banner">
  <a class="brand" href="./index.html" aria-label="DealLens home">
    <span class="brand-logo" role="img" aria-hidden="true"></span>
    <span>DealLens · Marketlogic Investors</span>
  </a>
  <nav class="app-nav" aria-label="Main navigation">
    <a href="./deals.html" class="nav-link active" aria-current="page">Pipeline</a>
    <a href="./submit.html" class="nav-link">Submit</a>
    <a class="nav-link nav-link--stub" aria-disabled="true" tabindex="-1">Settings</a>
  </nav>
</header>

<main class="page-wrap" id="main-content">
  <div class="page-bar">
    <div>
      <p class="page-kicker">Deal pipeline</p>
      <h1>Pipeline.</h1>
      <p class="lede">All deals on the table, by stage. Click any card to read its 14-chapter memo.</p>
    </div>
    <a class="btn-primary" href="./submit.html" aria-label="Submit a new deal">+ Submit deal</a>
  </div>
  <div class="board" id="board" role="list" aria-label="Deal pipeline by stage"></div>
</main>

<footer class="app-footer" role="contentinfo">
  <span>© 2026 Marketlogic Investors LLC · Internal use only.</span>
  <span id="build-meta" aria-label="App version"></span>
</footer>

<script>
'use strict';
const STAGES = [
  ['intake',     'Intake'],
  ['enriching',  'Enriching'],
  ['memo-ready', 'Memo ready'],
  ['ic-review',  'IC review'],
  ['decision',   'Decision']
];

async function load() {
  let list = [];
  try {
    const r = await fetch('./deals/index.json', { cache: 'no-store' });
    if (r.ok) list = await r.json();
  } catch (e) {}
  if (!Array.isArray(list)) list = [];

  const board = document.getElementById('board');
  board.innerHTML = '';

  for (const [key, label] of STAGES) {
    const col = document.createElement('div');
    col.className = 'col';
    col.setAttribute('role', 'listitem');
    col.setAttribute('aria-label', label + ' stage');

    const head = document.createElement('h2');
    head.className = 'col-head';
    head.textContent = label;
    col.appendChild(head);

    const items = list.filter(d => (d.status || 'intake') === key);
    if (!items.length) {
      const empty = document.createElement('p');
      empty.className = 'col-empty';
      empty.textContent = 'No deals.';
      col.appendChild(empty);
    }

    for (const d of items) {
      const a = document.createElement('a');
      a.className = 'deal-card';
      a.href = './deal.html?id=' + encodeURIComponent(d.id);
      a.setAttribute('aria-label', (d.name || d.id) + ', ' + (d.stage || '') + ' ' + (d.sector || ''));
      a.innerHTML =
        '<p class="deal-name">' + (d.name || d.id) + '</p>' +
        '<p class="deal-meta">' + (d.stage || '') + (d.sector ? ' · ' + d.sector : '') + '</p>';
      col.appendChild(a);
    }
    board.appendChild(col);
  }
}

(async function loadBuild() {
  try {
    const r = await fetch('./build.json', { cache: 'no-store' });
    const b = await r.json();
    const el = document.getElementById('build-meta');
    if (el) el.textContent = 'v' + b.version + ' · ' + b.commit;
  } catch (e) {}
})();

load();
</script>
</body>
</html>

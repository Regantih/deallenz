<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Pipeline · DealLens</title>
<style>
:root{--ink:#1a1a1a;--paper:#f5f1e8;--rule:#d8d2c2;--accent:#8b6f3d;--mute:#6b6358}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Georgia,'Times New Roman',serif;line-height:1.6}
header{padding:24px 40px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;align-items:center}
header a{color:var(--ink);text-decoration:none;font-weight:600}
header nav a{margin-left:24px;font-weight:400;color:var(--mute)}
main{max-width:1100px;margin:48px auto;padding:0 32px}
h1{font-size:48px;line-height:1.1;margin:0 0 8px}
.lede{color:var(--mute);font-size:18px;margin:0 0 40px}
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:24px}
.col{background:#fbf8f0;border:1px solid var(--rule);border-radius:6px;padding:14px;min-height:280px}
.col h3{margin:0 0 10px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-family:'Courier New',monospace;color:var(--accent)}
.card{background:#fff;border:1px solid var(--rule);border-radius:4px;padding:12px;margin-bottom:10px;text-decoration:none;color:var(--ink);display:block}
.card:hover{border-color:var(--ink)}
.card .n{font-weight:700;font-size:16px;margin:0 0 4px}
.card .m{font-size:12px;color:var(--mute);font-family:'Courier New',monospace}
.empty{font-size:13px;color:var(--mute);font-style:italic}
.bar{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:8px}
.btn{display:inline-block;padding:10px 18px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);text-decoration:none;border-radius:4px;font-weight:600}
</style>
</head>
<body>
<header>
  <a href="./">DealLens · Marketlogic Investors</a>
  <nav><a href="./">Memo</a><a href="./deals.html">Pipeline</a><a href="./submit.html">Submit</a></nav>
</header>
<main>
  <div class="bar"><div><h1>Pipeline.</h1><p class="lede">All deals on the table, by stage. Click any card to read its 14-chapter memo.</p></div><a class="btn" href="./submit.html">+ Submit deal</a></div>
  <div class="board" id="board"></div>
</main>
<script>
const STAGES=[['intake','Intake'],['enriching','Enriching'],['memo-ready','Memo ready'],['ic-review','IC review'],['decision','Decision']];
async function load(){let list=[];try{const r=await fetch('./deals/index.json',{cache:'no-store'});if(r.ok)list=await r.json();}catch(e){}if(!Array.isArray(list))list=[];const b=document.getElementById('board');b.innerHTML='';for(const [k,label] of STAGES){const col=document.createElement('div');col.className='col';col.innerHTML='<h3>'+label+'</h3>';const items=list.filter(d=>{let s=d.status||'intake';if(s==='review')s='memo-ready';return s===k;});if(!items.length)col.innerHTML+='<div class="empty">No deals.</div>';for(const d of items){const a=document.createElement('a');a.className='card';a.href='./deal.html?id='+encodeURIComponent(d.id);a.innerHTML='<p class="n">'+(d.name||d.id)+'</p><p class="m">'+(d.stage||'')+' · '+(d.sector||'')+'</p>';col.appendChild(a);}b.appendChild(col);}}
load();
</script>
</body>
</html>

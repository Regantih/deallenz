<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Pipeline · DealLens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#09090b;--surface:#111113;--surface-2:#18181b;--border:rgba(255,255,255,0.07);--border-2:rgba(255,255,255,0.12);--text:#fafafa;--muted:#71717a;--muted-2:#52525b;--accent:#6366f1;--accent-glow:rgba(99,102,241,0.15);--success:#22c55e;--danger:#ef4444;--warning:#f59e0b;--ink:#fafafa;--paper:#09090b;--rule:rgba(255,255,255,0.07);--mute:#71717a;--white:#111113;--emerald:#22c55e;--rose:#ef4444}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;line-height:1.6}
header{height:56px;padding:0 32px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;background:rgba(9,9,11,0.8);backdrop-filter:blur(12px)}
header a{color:var(--text);text-decoration:none;font-weight:600;font-size:14px}
header nav a{margin-left:8px;font-weight:500;color:var(--muted);font-size:13px;text-decoration:none;padding:5px 10px;border-radius:6px;transition:color .15s ease,background .15s ease}
header nav a:hover{color:var(--text);background:var(--surface-2)}
main{max-width:1200px;margin:0 auto;padding:48px 32px}
h1{font-size:40px;line-height:1.1;margin:0 0 8px;letter-spacing:-0.04em;font-weight:700}
.lede{color:var(--muted);font-size:18px;margin:0 0 40px}
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-top:24px}
.col{background:var(--surface);border-radius:10px;box-shadow:0 0 0 1px var(--border);padding:14px;min-height:280px}
.col h3{margin:0 0 10px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-family:'JetBrains Mono','Fira Code','Courier New',monospace;color:var(--muted-2);display:flex;align-items:center;gap:7px}
.col h3::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;flex-shrink:0}
.col:nth-child(1) h3::before{background:#52525b}
.col:nth-child(2) h3::before{background:var(--warning);box-shadow:0 0 6px rgba(245,158,11,0.4)}
.col:nth-child(3) h3::before{background:var(--accent);box-shadow:0 0 6px rgba(99,102,241,0.4)}
.col:nth-child(4) h3::before{background:var(--success);box-shadow:0 0 6px rgba(34,197,94,0.4)}
.col:nth-child(5) h3::before{background:var(--danger);box-shadow:0 0 6px rgba(239,68,68,0.4)}
.card{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:10px;text-decoration:none;color:var(--text);display:block;transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease}
.card:hover{transform:translateY(-1px);border-color:var(--border-2);box-shadow:0 4px 16px rgba(0,0,0,0.3)}
.card .n{font-weight:600;font-size:14px;margin:0 0 4px}
.card .m{font-size:11px;color:var(--muted);font-family:'JetBrains Mono','Fira Code','Courier New',monospace;text-transform:uppercase;margin:0}
.empty{font-size:13px;color:var(--muted);font-style:italic}
.bar{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:8px}
.btn{display:inline-block;padding:10px 18px;border:none;background:var(--accent);color:#fff;text-decoration:none;border-radius:6px;font-weight:600;font-size:14px;cursor:pointer;transition:background .15s ease,box-shadow .15s ease,transform .15s ease}
.btn:hover{background:#4f52d6;box-shadow:0 0 0 3px var(--accent-glow)}
.btn:active{transform:scale(0.98)}
</style>
</head>
<body>
<header>
  <a href="./">DealLens · Marketlogic Investors</a>
    <nav><a href="/deals">Pipeline (New)</a><a href="./deals.html">Pipeline (Legacy)</a><a href="./submit.html">Submit</a></nav>
</header>
<main>
  <div class="bar"><div><h1>Pipeline.</h1><p class="lede">All deals on the table, by stage. Click any card to read its 14-chapter memo.</p></div><a class="btn" href="./submit.html">+ Submit deal</a></div>
  <div class="board" id="board"></div>
</main>
<script>
const STAGES=[['intake','Intake'],['enriching','Enriching'],['memo-ready','Memo ready'],['ic-review','IC review'],['decision','Decision']];
async function load(){let list=[];try{const r=await fetch('./deals/index.json',{cache:'no-store'});if(r.ok)list=await r.json();}catch(e){}if(!Array.isArray(list))list=[];const b=document.getElementById('board');b.innerHTML='';for(const [k,label] of STAGES){const col=document.createElement('div');col.className='col';col.innerHTML='<h3>'+label+'</h3>';const items=list.filter(d=>{let s=d.status||'intake';if(s==='review')s='memo-ready';return s===k;});if(!items.length)col.innerHTML+='<div class="empty">No deals.</div>';for(const d of items){const a=document.createElement('a');a.className='card';a.href='./deal.html?id='+encodeURIComponent(d.id);a.innerHTML='<p class="n">'+(d.name||d.id)+'</p><p class="m">'+(d.stage||'')+' · '+(d.sector||'')+'</p>';col.appendChild(a);}b.appendChild(col);}}
load();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Pipeline · DealLens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#09090b;--surface:#111113;--surface-2:#18181b;--border:rgba(255,255,255,0.07);--border-2:rgba(255,255,255,0.12);--text:#fafafa;--muted:#71717a;--muted-2:#52525b;--accent:#6366f1;--accent-glow:rgba(99,102,241,0.15);--success:#22c55e;--danger:#ef4444;--warning:#f59e0b;--ink:#fafafa;--paper:#09090b;--rule:rgba(255,255,255,0.07);--mute:#71717a;--ok:#22c55e;--err:#ef4444;--card:#111113}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;line-height:1.55}
header.top{height:56px;padding:0 32px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;background:rgba(9,9,11,0.85);position:sticky;top:0;z-index:100;backdrop-filter:blur(12px)}
header.top a{color:var(--text);text-decoration:none;font-weight:600;font-size:14px}
header.top nav a{margin-left:8px;font-weight:500;color:var(--muted);font-size:13px;text-decoration:none;padding:5px 10px;border-radius:6px;transition:color .15s,background .15s}
header.top nav a:hover{color:var(--text);background:var(--surface-2)}
header.top nav a.active{color:var(--text);background:var(--surface-2);font-weight:600}
.wrap{max-width:1200px;margin:32px auto;padding:0 32px}
h1{font-size:36px;line-height:1.1;margin:0 0 8px;font-weight:700;letter-spacing:-0.03em}
.lede{color:var(--muted);font-size:17px;margin:0 0 24px;max-width:720px}
.kicker{font-family:'JetBrains Mono','Fira Code','Courier New',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.grid{display:grid;grid-template-columns:1fr 360px;gap:32px}
.agents{display:flex;flex-direction:column;gap:16px}
.agent{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px;transition:border-color .15s}
.agent:hover{border-color:var(--border-2)}
.ah{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.agent h2{margin:0;font-size:20px;font-weight:600;letter-spacing:-0.02em}
.role{color:var(--muted);font-size:13px;margin:0 0 12px}
.status{font-family:'JetBrains Mono','Fira Code','Courier New',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:99px;border:1px solid var(--border-2);color:var(--muted-2)}
.status.run{color:var(--accent);border-color:var(--accent);box-shadow:0 0 6px var(--accent-glow)}
.status.ok{color:var(--success);border-color:var(--success)}
.log{background:var(--bg);color:var(--muted);font-family:'JetBrains Mono','Fira Code','Courier New',monospace;font-size:11.5px;padding:12px;border-radius:6px;border:1px solid var(--border);max-height:200px;overflow:auto;white-space:pre-wrap;margin:8px 0;display:none}
.log.show{display:block}
.evidence{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-top:10px}
.ev{border:1px solid var(--border);border-radius:6px;padding:10px;font-size:13px;background:var(--surface-2)}
.ev b{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted-2);margin-bottom:4px;font-family:'JetBrains Mono',monospace}
aside{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px;height:fit-content;position:sticky;top:76px}
aside h3{margin:0 0 12px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-2);font-family:'JetBrains Mono',monospace}
.row{display:flex;justify-content:space-between;border-bottom:1px solid var(--border);padding:7px 0;font-size:13px}
.row span:first-child{font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;color:var(--muted-2);letter-spacing:.08em}
.row span:last-child{text-align:right;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
button{font-family:Inter,-apple-system,sans-serif;font-size:14px;padding:10px 16px;border:none;background:var(--accent);color:#fff;cursor:pointer;border-radius:6px;width:100%;margin-bottom:8px;font-weight:600;transition:background .15s,box-shadow .15s,transform .15s}
button:hover{background:#4f52d6;box-shadow:0 0 0 3px var(--accent-glow)}
button:active{transform:scale(0.98)}
button.ghost{background:transparent;color:var(--text);border:1px solid var(--border-2)}
button.ghost:hover{background:var(--surface-2);box-shadow:none}
button:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.bar{display:flex;gap:12px;margin-bottom:24px;align-items:center;flex-wrap:wrap}
.bar button{width:auto}
.meta{color:var(--muted);font-size:12px;font-family:'JetBrains Mono',monospace}
.empty{padding:20px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--border-2);border-radius:6px;font-size:14px}
.tools{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted-2);letter-spacing:.06em}
</style>
</head>
<body>
<header class="top">
  <a href="index.html">DealLens · Marketlogic Investors</a>
  <nav>
    <a href="deal.html">Memo</a>
    <a href="pipeline.html" class="active">Pipeline</a>
    <a href="submit.html">Submit</a>
    <a href="deals.html">Vault</a>
  </nav>
</header>
<div class="wrap">
  <div class="kicker">04 · ENRICHMENT</div>
  <h1>Agents at work.</h1>
  <p class="lede">Four specialist agents take the intake record, hit their tools, cite evidence, and hand a structured payload to the memo writer.</p>
  <div class="bar">
    <button id="runAll">Run all agents</button>
    <button id="reset" class="ghost">Reset</button>
    <span class="meta" id="meta">No deal loaded</span>
  </div>
  <div class="grid">
    <div class="agents" id="agents"></div>
    <aside>
      <h3>Live record</h3>
      <div id="record"><div class="empty">Submit a deal first.</div></div>
      <div style="margin-top:16px">
        <button onclick="location.href='submit.html'" class="ghost">← Back to intake</button>
        <button id="toMemo" disabled>Write memo →</button>
      </div>
    </aside>
  </div>
</div>
<script>
const AGENTS=[
 {id:'ingest',name:'Ingest Agent',role:'Normalizes the intake record, validates schema, dedupes against the vault.',tools:['schema.validate','vault.lookup','record.normalize']},
 {id:'research',name:'Research Agent',role:'Pulls market signals, comps, and recent news. Cites every claim.',tools:['web.search','crunchbase.lookup','news.recent']},
 {id:'team',name:'Team Agent',role:'Scores founders on domain fit, prior outcomes, and execution velocity.',tools:['linkedin.profile','github.activity','team.score']},
 {id:'unitecon',name:'Unit-Econ Agent',role:'Builds bottoms-up model: ARR, GM, CAC payback, burn multiple, runway.',tools:['model.build','sensitivity.run','benchmark.compare']}
];
const $=id=>document.getElementById(id);
const rec=()=>{try{return JSON.parse(localStorage.getItem('deallens:record')||'{}')}catch(e){return{}}};
const saveEnrich=(id,out)=>{const e=JSON.parse(localStorage.getItem('deallens:enrich')||'{}');e[id]=out;localStorage.setItem('deallens:enrich',JSON.stringify(e))};
const FIELDS=['company','stage','sector','hq','website','thesis','ask','wtp','founders','arr','mom','nrr'];
function renderRecord(){const r=rec();const el=$('record');if(!r.company){el.innerHTML='<div class="empty">Submit a deal first.</div>';$('meta').textContent='No deal loaded';return}
 el.innerHTML=FIELDS.map(f=>`<div class="row"><span>${f}</span><span>${r[f]||'—'}</span></div>`).join('');
 $('meta').textContent=`Loaded: ${r.company} · ${r.stage||'?'} · ${r.sector||'?'}`}
function renderAgents(){$('agents').innerHTML=AGENTS.map(a=>`<div class="agent" id="a-${a.id}"><div class="ah"><h2>${a.name}</h2><span class="status" id="s-${a.id}">idle</span></div><p class="role">${a.role}</p><div class="tools">TOOLS · ${a.tools.join(' · ')}</div><div class="log" id="l-${a.id}"></div><div class="evidence" id="e-${a.id}"></div></div>`).join('')}
function setStatus(id,s,cls){const el=$('s-'+id);el.textContent=s;el.className='status '+(cls||'')}
function log(id,line){const el=$('l-'+id);el.classList.add('show');el.textContent+=line+'\n';el.scrollTop=el.scrollHeight}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
async function runAgent(a){const r=rec();setStatus(a.id,'running','run');log(a.id,`[${new Date().toISOString().slice(11,19)}] boot → loading record for ${r.company||'?'}`);
 for(const t of a.tools){await sleep(400+Math.random()*600);log(a.id,`  → tool: ${t}() … ok`)}
 const out=mockOutput(a.id,r);log(a.id,`[done] emitted ${out.evidence.length} evidence items`);
 $('e-'+a.id).innerHTML=out.evidence.map(e=>`<div class="ev"><b>${e.label}</b>${e.value}</div>`).join('');
 saveEnrich(a.id,out);setStatus(a.id,'complete','ok')}
function mockOutput(id,r){
 const filledKeys=['company','stage','sector','hq','website','thesis','ask','premoney','arr','mom','logos','nrr'];
 const filled=filledKeys.filter(k=>r[k]!=null&&r[k]!=='').length;
 const pct=Math.round(filled/filledKeys.length*100)+'%';
 if(id==='ingest')return{evidence:[
   {label:'schema',value:'valid'},
   {label:'duplicates',value:'none in vault'},
   {label:'completeness',value:pct}
 ]};
 if(id==='research')return{evidence:[
   {label:'status',value:'Research agent not connected'},
   {label:'TAM',value:'Requires web search tools'},
   {label:'comps',value:'Requires Crunchbase / Pitchbook access'},
   {label:'news',value:'Requires news search tools'}
 ]};
 if(id==='team')return{evidence:[
   {label:'status',value:'Team agent not connected'},
   {label:'domain fit',value:'Requires LinkedIn profile access'},
   {label:'velocity',value:'Requires GitHub activity data'}
 ]};
 if(id==='unitecon')return{evidence:[
   {label:'ARR',value:r.arr?'$'+Number(r.arr).toLocaleString():'Not provided'},
   {label:'MoM growth',value:r.mom?r.mom+'%':'Not provided'},
   {label:'NRR',value:r.nrr?r.nrr+'%':'Not provided'},
   {label:'status',value:'GM, CAC, burn multiple require financial model upload'}
 ]};
 return{evidence:[]}}
async function runAll(){if(!rec().company){alert('Submit a deal first.');return}
 $('runAll').disabled=true;for(const a of AGENTS)await runAgent(a);$('toMemo').disabled=false;$('runAll').disabled=false}
$('runAll').onclick=runAll;
$('reset').onclick=()=>{localStorage.removeItem('deallens:enrich');renderAgents();$('toMemo').disabled=true};
$('toMemo').onclick=()=>location.href='deal.html';
renderAgents();renderRecord();
</script>
</body>
</html>
